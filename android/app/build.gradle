plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.lightclouddisk'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lightclouddisk"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 配置服务器地址和API密钥
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"http://117.72.196.45/syncqclous/\""
        buildConfigField "String", "DEFAULT_API_KEY", "\"light-cloud-disk-2026\""
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "lightcloud123"
            keyAlias "lightclouddisk"
            keyPassword "lightcloud123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"http://117.72.196.45/syncqclous/\""
            buildConfigField "String", "DEFAULT_API_KEY", "\"light-cloud-disk-2026\""
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    
    // Glide for image loading (optional)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}