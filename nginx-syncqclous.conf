# Nginx 配置 for 轻量云盘
# 将此配置保存到 /etc/nginx/sites-available/light-cloud-disk
# 然后创建软链接：ln -s /etc/nginx/sites-available/light-cloud-disk /etc/nginx/sites-enabled/
# 或者将此内容添加到 /etc/nginx/nginx.conf 的 http 块中

server {
    listen 80;
    server_name _;

    # 前端静态文件 - 通过 /syncqclous 访问
    location /syncqclous {
        alias /opt/light-cloud-disk/web;
        index index.html;
        
        # 处理单页应用路由
        try_files $uri $uri/ /syncqclous/index.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端API代理 - 通过 /syncqclous/api/ 访问
    location /syncqclous/api/ {
        proxy_pass http://127.0.0.1:12140/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 支持大文件上传
        client_max_body_size 100M;
    }

    # 文件下载代理
    location /syncqclous/download/ {
        proxy_pass http://127.0.0.1:12140/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
