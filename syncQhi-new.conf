server {
    listen 80;
    server_name 117.72.196.45;

    location /syncQhi {
        proxy_pass http://127.0.0.1:8200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /syncSolo/ {
        proxy_pass http://127.0.0.1:3210/syncSolo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 500M;
    }

    location = /syncSolo {
        return 301 /syncSolo/;
    }

    # syncBuddy 文件中转站
    location ^~ /syncBuddy/ {
        proxy_pass http://127.0.0.1:12131/syncBuddy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 500M;
    }

    location = /syncBuddy {
        return 301 /syncBuddy/;
    }

    # syncBuddy APK 直接下载
    location = /syncBuddy-app.apk {
        root /var/www/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=syncBuddy-app.apk";
    }

    location = /syncBuddy-app-release.apk {
        root /var/www/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=syncBuddy-app-release.apk";
    }

    # Light Cloud Disk - 轻量云盘前端
    location /syncqclous/ {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Light Cloud Disk - API代理
    location /syncqclous/api/ {
        proxy_pass http://127.0.0.1:12140/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # Light Cloud Disk - 下载代理
    location /syncqclous/download/ {
        proxy_pass http://127.0.0.1:12140/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
