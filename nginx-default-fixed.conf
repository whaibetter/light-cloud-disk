server {
    listen 80;
    listen [::]:80;
    server_name _;

    # CloudFiles 个人云盘
    location /syncBuddys/ {
        proxy_pass http://127.0.0.1:12134/syncBuddys/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    location = /syncBuddys {
        return 301 /syncBuddys/;
    }

    # CloudDrive 云盘
    location /syncCloud/ {
        proxy_pass http://127.0.0.1:12139/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2048M;
    }

    location = /syncCloud {
        return 301 /syncCloud/;
    }

    # Light Cloud Disk - 轻量云盘前端
    location /syncqclous/ {
        alias /opt/light-cloud-disk/web/;
        index index.html;
    }

    # Light Cloud Disk - API后端
    location /syncqclous/api/ {
        proxy_pass http://127.0.0.1:12140/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    location /syncqclous/download/ {
        proxy_pass http://127.0.0.1:12140/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
